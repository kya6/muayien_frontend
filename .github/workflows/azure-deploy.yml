name: Build and deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: muayien-frontend
  # Set these as repo secrets, then uncomment the right job below.
  # ACR_NAME: your-registry             # e.g. muayienacr (without .azurecr.io)
  # AZURE_WEBAPP_NAME: muayien-frontend  # App Service name

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

